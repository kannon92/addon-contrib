  - coveredResources: [cpu, memory]
    flavors:
    - name: onprem-tas
      resources:
      - {name: cpu, nominalQuota: 12}
      - {name: memory, nominalQuota: 48Gi}
  admissionChecksStrategy:
    admissionChecks:
    - name: mk-tas-onprem
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: onprem-queue
  namespace: inference-tas
spec:
  clusterQueue: cq-tas-onprem
---
# gpu-cloud spans two providers that share no rack-level label, so the only level the
# hub can check is the node. Workloads on this queue prefer kubernetes.io/hostname, and each
# worker widens to its own next level if a group doesn't fit on one node.
# IBM Cloud or CoreWeave: topology levels, from widest to narrowest
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: gpu-cloud
spec:
  levels:
  - nodeLabel: kubernetes.io/hostname
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-cloud-tas
spec:
  nodeLabels: {type: kwok}   # TAS flavors need a node selector; no hub node matches it
  topologyName: gpu-cloud
---
# OCM check: keeps MultiKueueConfig "tas-gpu-cloud" in sync with Placement "tas-gpu-cloud".
# Intentionally NOT listed on the ClusterQueue (see the README).
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: ocm-tas-gpu-cloud
spec:
  controllerName: open-cluster-management.io/placement
  parameters: {apiGroup: cluster.open-cluster-management.io, kind: Placement, name: tas-gpu-cloud}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: mk-tas-gpu-cloud
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters: {apiGroup: kueue.x-k8s.io, kind: MultiKueueConfig, name: tas-gpu-cloud}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-tas-gpu-cloud
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: [cpu, memory]
    flavors:
    - name: gpu-cloud-tas
      resources:
      - {name: cpu, nominalQuota: 16}
      - {name: memory, nominalQuota: 64Gi}
  admissionChecksStrategy:
    admissionChecks:
    - name: mk-tas-gpu-cloud
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-cloud-queue
  namespace: inference-tas
spec:
  clusterQueue: cq-tas-gpu-cloud
