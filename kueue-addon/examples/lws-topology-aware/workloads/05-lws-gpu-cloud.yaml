# Burst to IBM Cloud or CoreWeave. The two clouds share no rack label, so this workload prefers
# the one level they share, the node. If a group doesn't fit on one node, Kueue widens to the
# next level of whichever cluster runs it (an IBM rack, or a CoreWeave ib-leaf).
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: burst-a
  namespace: inference-tas
  labels:
    kueue.x-k8s.io/queue-name: gpu-cloud-queue
    app: burst
    role: serving
spec:
  replicas: 1                 # number of groups; Kueue creates one Workload per group
  leaderWorkerTemplate:
    size: 2                   # pods per group (1 leader + 1 worker)
    leaderTemplate:
      metadata:
        labels: {app: burst, role: serving, pod-type: leader}
        annotations:
          kueue.x-k8s.io/podset-preferred-topology: kubernetes.io/hostname   # the one level every provider has
          kueue.x-k8s.io/podset-group-name: burst-a           # leader and workers share one domain
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "serving leader $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "1", memory: 1Gi}
    workerTemplate:
      metadata:
        labels: {app: burst, role: serving, pod-type: worker}
        annotations:
          kueue.x-k8s.io/podset-preferred-topology: kubernetes.io/hostname   # the one level every provider has
          kueue.x-k8s.io/podset-group-name: burst-a           # leader and workers share one domain
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "serving worker $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "1", memory: 1Gi}
