# A mistake: IBM's rack label on the CoreWeave queue. The hub rejects it before dispatch.
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: llama-typo
  namespace: inference-tas
  labels:
    kueue.x-k8s.io/queue-name: coreweave-queue
    app: llama-typo
    role: serving
spec:
  replicas: 1                 # number of groups; Kueue creates one Workload per group
  leaderWorkerTemplate:
    size: 2                   # pods per group (1 leader + 1 worker)
    leaderTemplate:
      metadata:
        labels: {app: llama-typo, role: serving, pod-type: leader}
        annotations:
          kueue.x-k8s.io/podset-required-topology: ibm.example.com/rack
          kueue.x-k8s.io/podset-group-name: llama-typo           # leader and workers share one domain
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "serving leader $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "1", memory: 1Gi}
    workerTemplate:
      metadata:
        labels: {app: llama-typo, role: serving, pod-type: worker}
        annotations:
          kueue.x-k8s.io/podset-required-topology: ibm.example.com/rack
          kueue.x-k8s.io/podset-group-name: llama-typo           # leader and workers share one domain
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "serving worker $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "1", memory: 1Gi}
