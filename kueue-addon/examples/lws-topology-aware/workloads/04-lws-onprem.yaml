# Regulated serving that must stay on-prem, in one data-center rack.
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: granite
  namespace: inference-tas
  labels:
    kueue.x-k8s.io/queue-name: onprem-queue
    app: granite
    role: serving
spec:
  replicas: 1                 # number of groups; Kueue creates one Workload per group
  leaderWorkerTemplate:
    size: 4                   # pods per group (1 leader + 3 workers)
    leaderTemplate:
      metadata:
        labels: {app: granite, role: serving, pod-type: leader}
        annotations:
          kueue.x-k8s.io/podset-required-topology: dc.example.com/rack
          kueue.x-k8s.io/podset-group-name: granite           # leader and workers share one domain
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "serving leader $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "1", memory: 1Gi}
    workerTemplate:
      metadata:
        labels: {app: granite, role: serving, pod-type: worker}
        annotations:
          kueue.x-k8s.io/podset-required-topology: dc.example.com/rack
          kueue.x-k8s.io/podset-group-name: granite           # leader and workers share one domain
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "serving worker $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "1", memory: 1Gi}
