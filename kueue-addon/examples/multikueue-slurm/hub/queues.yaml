apiVersion: v1
kind: Namespace
metadata:
  name: hpc
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
---
# OCM check: keeps MultiKueueConfig "kube-batch" in sync with Placement "kube-batch".
# Not listed on the ClusterQueue: since Kueue v0.20 MultiKueue waits for every other
# check on a workload to be Ready, and this one never marks workloads Ready.
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: ocm-kube-batch
spec:
  controllerName: open-cluster-management.io/placement
  parameters: {apiGroup: cluster.open-cluster-management.io, kind: Placement, name: kube-batch}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: mk-kube-batch
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters: {apiGroup: kueue.x-k8s.io, kind: MultiKueueConfig, name: kube-batch}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-kube-batch
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: [cpu, memory]
    flavors:
    - name: default-flavor
      resources:
      - {name: cpu, nominalQuota: 8}
      - {name: memory, nominalQuota: 32Gi}
  admissionChecksStrategy:
    admissionChecks:
    - name: mk-kube-batch
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: kube-queue
  namespace: hpc
spec:
  clusterQueue: cq-kube-batch
---
# OCM check: keeps MultiKueueConfig "slurm" in sync with Placement "slurm".
# Not listed on the ClusterQueue: since Kueue v0.20 MultiKueue waits for every other
# check on a workload to be Ready, and this one never marks workloads Ready.
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: ocm-slurm
spec:
  controllerName: open-cluster-management.io/placement
  parameters: {apiGroup: cluster.open-cluster-management.io, kind: Placement, name: slurm}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: mk-slurm
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters: {apiGroup: kueue.x-k8s.io, kind: MultiKueueConfig, name: slurm}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-slurm
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: [cpu, memory]
    flavors:
    - name: default-flavor
      resources:
      - {name: cpu, nominalQuota: 8}
      - {name: memory, nominalQuota: 32Gi}
  admissionChecksStrategy:
    admissionChecks:
    - name: mk-slurm
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: slurm-queue
  namespace: hpc
spec:
  clusterQueue: cq-slurm
