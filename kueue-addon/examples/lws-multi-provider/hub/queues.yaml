apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
---
# OCM check: keeps MultiKueueConfig "ibm" in sync with Placement "ibm".
# NOTE: intentionally NOT listed on the ClusterQueue. Kueue v0.20 MultiKueue waits for
# every non-MultiKueue check to be Ready, and the addon never marks it Ready per workload.
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: ocm-ibm
spec:
  controllerName: open-cluster-management.io/placement
  parameters: {apiGroup: cluster.open-cluster-management.io, kind: Placement, name: ibm}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: mk-ibm
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters: {apiGroup: kueue.x-k8s.io, kind: MultiKueueConfig, name: ibm}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-ibm
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: [cpu, memory]
    flavors:
    - name: default-flavor
      resources:
      - {name: cpu, nominalQuota: 9}
      - {name: memory, nominalQuota: 36Gi}
  admissionChecksStrategy:
    admissionChecks:
    - name: mk-ibm
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: ibm-queue
  namespace: inference
spec:
  clusterQueue: cq-ibm
---
