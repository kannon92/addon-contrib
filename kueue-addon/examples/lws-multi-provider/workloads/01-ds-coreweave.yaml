# Disaggregated serving on CoreWeave: prefill + decode pinned to ONE provider so the
# KV-cache transfer between them stays inside a single cluster.
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: llama-prefill
  namespace: inference
  labels:
    kueue.x-k8s.io/queue-name: coreweave-queue
    app: llama-ds
    role: prefill
spec:
  replicas: 1                 # number of groups; Kueue creates one Workload per group
  leaderWorkerTemplate:
    size: 2                   # pods per group (1 leader + 1 worker)
    leaderTemplate:
      metadata:
        labels: {app: llama-ds, role: prefill, pod-type: leader}
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "prefill leader $(hostname) group=$LWS_GROUP_INDEX"; sleep 3600']
          resources:
            requests: {cpu: "500m", memory: 256Mi}
    workerTemplate:
      metadata:
        labels: {app: llama-ds, role: prefill, pod-type: worker}
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "prefill worker $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "500m", memory: 256Mi}
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: llama-decode
  namespace: inference
  labels:
    kueue.x-k8s.io/queue-name: coreweave-queue
    app: llama-ds
    role: decode
spec:
  replicas: 2                 # number of groups; Kueue creates one Workload per group
  leaderWorkerTemplate:
    size: 2                   # pods per group (1 leader + 1 worker)
    leaderTemplate:
      metadata:
        labels: {app: llama-ds, role: decode, pod-type: leader}
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "decode leader $(hostname) group=$LWS_GROUP_INDEX"; sleep 3600']
          resources:
            requests: {cpu: "500m", memory: 256Mi}
    workerTemplate:
      metadata:
        labels: {app: llama-ds, role: decode, pod-type: worker}
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "decode worker $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "500m", memory: 256Mi}
