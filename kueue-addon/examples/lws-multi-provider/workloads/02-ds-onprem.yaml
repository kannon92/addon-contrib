# Same disaggregated app, but data must stay on-prem (sovereignty / regulated data).
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: granite-prefill
  namespace: inference
  labels:
    kueue.x-k8s.io/queue-name: onprem-queue
    app: granite-ds
    role: prefill
spec:
  replicas: 1                 # number of groups; Kueue creates one Workload per group
  leaderWorkerTemplate:
    size: 2                   # pods per group (1 leader + 1 worker)
    leaderTemplate:
      metadata:
        labels: {app: granite-ds, role: prefill, pod-type: leader}
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "prefill leader $(hostname) group=$LWS_GROUP_INDEX"; sleep 3600']
          resources:
            requests: {cpu: "500m", memory: 256Mi}
    workerTemplate:
      metadata:
        labels: {app: granite-ds, role: prefill, pod-type: worker}
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "prefill worker $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "500m", memory: 256Mi}
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
