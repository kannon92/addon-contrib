# Burst capacity: any public cloud (IBM or CoreWeave). MultiKueue dispatches to whichever
# admits first; all groups of ONE LWS always land on the same cluster.
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: burst-a
  namespace: inference
  labels:
    kueue.x-k8s.io/queue-name: gpu-cloud-queue
    app: burst
    role: serving
spec:
  replicas: 1                 # number of groups; Kueue creates one Workload per group
  leaderWorkerTemplate:
    size: 2                   # pods per group (1 leader + 1 worker)
    leaderTemplate:
      metadata:
        labels: {app: burst, role: serving, pod-type: leader}
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "serving leader $(hostname) group=$LWS_GROUP_INDEX"; sleep 3600']
          resources:
            requests: {cpu: "1", memory: 256Mi}
    workerTemplate:
      metadata:
        labels: {app: burst, role: serving, pod-type: worker}
      spec:
        containers:
        - name: server
          image: busybox:1.36
          command: [sh, -c, 'echo "serving worker $(hostname)"; sleep 3600']
          resources:
            requests: {cpu: "1", memory: 256Mi}
